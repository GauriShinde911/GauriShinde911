<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" fill="none">
  <defs>
    <linearGradient id="sea-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="sea-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" rx="14" fill="url(#sea-bg)"/>
  <circle cx="320" cy="180" r="180" fill="url(#sea-glow)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640M120 0v360M240 0v360M360 0v360M480 0v360" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>

  <!-- Agent Graph Visualization -->
  <g opacity="0.85">
    <line x1="200" y1="140" x2="320" y2="100" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="320" y1="100" x2="440" y2="140" stroke="#38BDF8" stroke-width="2"/>
    <line x1="200" y1="140" x2="260" y2="230" stroke="#0284C7" stroke-width="2"/>
    <line x1="440" y1="140" x2="380" y2="230" stroke="#818CF8" stroke-width="2"/>
    <line x1="260" y1="230" x2="380" y2="230" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3"/>

    <circle cx="200" cy="140" r="10" fill="#030712" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="320" cy="100" r="13" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="440" cy="140" r="10" fill="#030712" stroke="#818CF8" stroke-width="2.5"/>
    <circle cx="260" cy="230" r="9" fill="#030712" stroke="#0284C7" stroke-width="2.5"/>
    <circle cx="380" cy="230" r="9" fill="#030712" stroke="#818CF8" stroke-width="2.5"/>

    <circle cx="320" cy="100" r="5" fill="#38BDF8"/>
    <circle cx="200" cy="140" r="4" fill="#38BDF8"/>
    <circle cx="440" cy="140" r="4" fill="#818CF8"/>
  </g>

  <!-- Tag Pill -->
  <rect x="36" y="32" width="130" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="101" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">AUTONOMOUS AGENT</text>

  <!-- Title & Sub -->
  <text x="36" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="-0.3">SEA Agent</text>
  <text x="36" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">State Graphs • Deterministic Routing • Runtime Guardrails</text>
</svg>
