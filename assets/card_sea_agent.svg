<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" fill="none">
  <rect width="640" height="360" rx="10" fill="#0D1726"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="9.5" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640M120 0v360M240 0v360M360 0v360M480 0v360" stroke="#162032" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Minimal State Graph -->
  <g transform="translate(320, 160)">
    <line x1="-120" y1="-20" x2="0" y2="-50" stroke="#253347" stroke-width="1.5"/>
    <line x1="0" y1="-50" x2="120" y2="-20" stroke="#253347" stroke-width="1.5"/>
    <line x1="-120" y1="-20" x2="-60" y2="50" stroke="#253347" stroke-width="1.5"/>
    <line x1="120" y1="-20" x2="60" y2="50" stroke="#253347" stroke-width="1.5"/>
    <line x1="-60" y1="50" x2="60" y2="50" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,4"/>

    <circle cx="-120" cy="-20" r="9" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle cx="0" cy="-50" r="11" fill="#162032" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="120" cy="-20" r="9" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle cx="-60" cy="50" r="8" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle cx="60" cy="50" r="8" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>

    <circle cx="0" cy="-50" r="4" fill="#60A5FA"/>
    <circle cx="-120" cy="-20" r="3" fill="#60A5FA"/>
    <circle cx="120" cy="-20" r="3" fill="#60A5FA"/>
  </g>

  <!-- Tag Pill -->
  <rect x="28" y="28" width="136" height="22" rx="11" fill="#162032" stroke="#253347" stroke-width="1"/>
  <text x="96" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">AUTONOMOUS AGENT</text>

  <!-- Title & Sub -->
  <text x="28" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">SEA Agent</text>
  <text x="28" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Deterministic state graphs and decision routing</text>
</svg>
