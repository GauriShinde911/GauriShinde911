  <text x="118" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#2DD4BF" text-anchor="middle" letter-spacing="1">PUBLISHED RESEARCH • WJIR</text>

