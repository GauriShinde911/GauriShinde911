<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="100%" fill="none">
  <defs>
    <style>
      .wf-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
      .wf-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #60A5FA; }
      .wf-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 400; fill: #64748B; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="840" height="120" rx="12" fill="#0D1726"/>
  <rect x="0.5" y="0.5" width="839" height="119" rx="11.5" stroke="#1E293B" stroke-width="1"/>

  <!-- Thin Connecting Axis Line -->
  <line x1="70" y1="42" x2="770" y2="42" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="70" y1="42" x2="770" y2="42" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>

  <!-- 1. Problem -->
  <g transform="translate(70, 42)">
    <circle r="13" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="4" fill="#60A5FA"/>
    <text x="0" y="28" text-anchor="middle" class="wf-title">Problem</text>
    <text x="0" y="41" text-anchor="middle" class="wf-sub">Specification</text>
  </g>

  <!-- 2. Data -->
  <g transform="translate(210, 42)">
    <circle r="13" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="4" fill="#60A5FA"/>
    <text x="0" y="28" text-anchor="middle" class="wf-title">Data</text>
    <text x="0" y="41" text-anchor="middle" class="wf-sub">Curated Schemas</text>
  </g>

  <!-- 3. AI Intelligence -->
  <g transform="translate(350, 42)">
    <circle r="14" fill="#162032" stroke="#60A5FA" stroke-width="1.5"/>
    <circle r="4.5" fill="#60A5FA"/>
    <text x="0" y="28" text-anchor="middle" class="wf-title" fill="#60A5FA">AI Intelligence</text>
    <text x="0" y="41" text-anchor="middle" class="wf-sub">Models &amp; Agents</text>
  </g>

  <!-- 4. Guardrails -->
  <g transform="translate(490, 42)">
    <circle r="13" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="4" fill="#60A5FA"/>
    <text x="0" y="28" text-anchor="middle" class="wf-title">Guardrails</text>
    <text x="0" y="41" text-anchor="middle" class="wf-sub">Verification</text>
  </g>

  <!-- 5. Decision Engine -->
  <g transform="translate(630, 42)">
    <circle r="13" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="4" fill="#60A5FA"/>
    <text x="0" y="28" text-anchor="middle" class="wf-title">Decision Engine</text>
    <text x="0" y="41" text-anchor="middle" class="wf-sub">State Routing</text>
  </g>

  <!-- 6. User Experience -->
  <g transform="translate(770, 42)">
    <circle r="13" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="4" fill="#60A5FA"/>
    <text x="0" y="28" text-anchor="middle" class="wf-title">User Experience</text>
    <text x="0" y="41" text-anchor="middle" class="wf-sub">Deterministic Product</text>
  </g>
</svg>
