<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" fill="none">
  <defs>
    <linearGradient id="agri-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#08201A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="agri-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" rx="14" fill="url(#agri-bg)"/>
  <circle cx="320" cy="180" r="180" fill="url(#agri-glow)"/>

  <!-- Subtle Grid -->
  <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640M120 0v360M240 0v360M360 0v360M480 0v360" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>

  <!-- Computer Vision Bounding Boxes & Mask Graphic -->
  <g opacity="0.85" transform="translate(320, 155)">
    <!-- Bounding reticle -->
    <rect x="-80" y="-55" width="160" height="110" rx="6" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4"/>
    <path d="M-80 -40v-15h15M65 -55h15v15M80 40v15h-15M-65 55h-15v-15" stroke="#34D399" stroke-width="2.5"/>
    <!-- Detected contour mask -->
    <path d="M-40 -15 C -20 -40, 30 -30, 45 -10 C 60 15, 20 40, -15 35 C -50 30, -60 10, -40 -15 Z" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">IoU: 0.89 • U-Net</text>
  </g>

  <!-- Tag Pill -->
  <rect x="36" y="32" width="150" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="111" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">COMPUTER VISION • U-NET</text>

  <!-- Title & Sub -->
  <text x="36" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="-0.3">Smart Agritech Weed Detection</text>
  <text x="36" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Automated HSV Mask Generation • PyTorch Segmentation • Targeted Spraying</text>
</svg>
