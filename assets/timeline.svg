<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="100%" fill="none">
  <defs>
    <style>
      .tl-year { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .tl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
      .tl-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 400; fill: #64748B; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="840" height="140" rx="12" fill="#0D1726"/>
  <rect x="0.5" y="0.5" width="839" height="139" rx="11.5" stroke="#1E293B" stroke-width="1"/>

  <!-- Subtle Timeline Axis Line -->
  <line x1="105" y1="52" x2="735" y2="52" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="105" y1="52" x2="525" y2="52" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- 2024 -->
  <g transform="translate(105, 52)">
    <circle r="10" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="3.5" fill="#60A5FA"/>
    <text x="0" y="-18" text-anchor="middle" class="tl-year" fill="#94A3B8">2024</text>
    <text x="0" y="26" text-anchor="middle" class="tl-title">Python</text>
    <text x="0" y="40" text-anchor="middle" class="tl-sub">Foundations &amp; OOP</text>
  </g>

  <!-- 2025 -->
  <g transform="translate(315, 52)">
    <circle r="10" fill="#0D1726" stroke="#253347" stroke-width="1.5"/>
    <circle r="3.5" fill="#60A5FA"/>
    <text x="0" y="-18" text-anchor="middle" class="tl-year" fill="#94A3B8">2025</text>
    <text x="0" y="26" text-anchor="middle" class="tl-title">Deep Learning</text>
    <text x="0" y="40" text-anchor="middle" class="tl-sub">Vision &amp; Neural Nets</text>
  </g>

  <!-- 2026 (Active) -->
  <g transform="translate(525, 52)">
    <circle r="12" fill="#162032" stroke="#60A5FA" stroke-width="1.5"/>
    <circle r="4.5" fill="#60A5FA"/>
    <text x="0" y="-20" text-anchor="middle" class="tl-year" fill="#60A5FA">2026</text>
    <text x="0" y="26" text-anchor="middle" class="tl-title" fill="#FFFFFF">Autonomous AI Agents</text>
    <text x="0" y="40" text-anchor="middle" class="tl-sub" fill="#94A3B8">Decision Systems</text>
  </g>

  <!-- NEXT -->
  <g transform="translate(735, 52)">
    <circle r="10" fill="#0D1726" stroke="#253347" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle r="3.5" fill="#94A3B8"/>
    <text x="0" y="-18" text-anchor="middle" class="tl-year" fill="#64748B">NEXT</text>
    <text x="0" y="26" text-anchor="middle" class="tl-title">AI Product Mgmt</text>
    <text x="0" y="40" text-anchor="middle" class="tl-sub">Strategy &amp; Systems</text>
  </g>
</svg>
